apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoid-app
  namespace: ${GKE_NAMESPACE}
  labels:
    app: geoid-app
    env: ${ENVIRONMENT}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geoid-app
  template:
    metadata:
      labels:
        app: geoid-app
    spec:
      serviceAccountName: geoid-app-ksa
      containers:
      - name: geoid-app
        image: ${IMAGE_REGISTRY}/geoid-ui:${VERSION}
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: geoid-config
        - secretRef:
            name: geoid-secrets
        env:
        - name: DEPLOYED_AT
          value: "${DEPLOYED_AT}"
        - name: HOST_URL
          value: "${HOST_URL}"
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: geoid-app
  namespace: ${GKE_NAMESPACE}
spec:
  selector:
    app: geoid-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
